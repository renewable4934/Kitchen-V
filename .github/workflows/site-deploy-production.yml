# Title: Site production deploy workflow
# Purpose: deploys promotion/site to the production app instance on Aeza after main branch updates.
# Owner: Project team
# Last updated: 2026-06-21

name: Site Deploy Production

on:
  push:
    branches:
      - main
    paths:
      - "promotion/site/**"
      - ".github/workflows/site-deploy-production.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: site-deploy-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    env:
      SSH_HOST: ${{ secrets.SSH_HOST }}
      SSH_PORT: ${{ secrets.SSH_PORT }}
      SSH_USER: ${{ secrets.SSH_USER }}
      SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
      APP_DIR: ${{ secrets.APP_DIR }}
      APP_PORT: ${{ secrets.APP_PORT }}
      APP_DOMAIN: ${{ secrets.APP_DOMAIN }}
      SERVICE_NAME: ${{ secrets.SERVICE_NAME }}
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      CRM_WEBHOOK_URL: ${{ secrets.CRM_WEBHOOK_URL }}
      BITRIX24_WEBHOOK_URL: ${{ secrets.BITRIX24_WEBHOOK_URL }}
      AIUP_GATEWAY_MANUAL_GATE: ${{ secrets.AIUP_GATEWAY_MANUAL_GATE }}
      AIUP_GATEWAY_APPROVAL_TOKEN: ${{ secrets.AIUP_GATEWAY_APPROVAL_TOKEN }}
      AIUP_GATEWAY_FIRST_REAL_CONTACT_APPROVAL_TOKEN: ${{ secrets.AIUP_GATEWAY_FIRST_REAL_CONTACT_APPROVAL_TOKEN }}
      BITRIX24_AIUP_CRM_WEBHOOK_URL: ${{ secrets.BITRIX24_AIUP_CRM_WEBHOOK_URL }}
      BITRIX24_TEST_CRM_WEBHOOK_URL: ${{ secrets.BITRIX24_TEST_CRM_WEBHOOK_URL }}
      AIUP_GATEWAY_DAILY_LIMIT: ${{ secrets.AIUP_GATEWAY_DAILY_LIMIT }}
      AIUP_GATEWAY_MODE: ${{ secrets.AIUP_GATEWAY_MODE }}
      AIUP_GATEWAY_NATIVE_WEBHOOK_ENABLED: ${{ secrets.AIUP_GATEWAY_NATIVE_WEBHOOK_ENABLED }}
      AIUP_GATEWAY_LIMITED_BATCH_ENABLED: ${{ secrets.AIUP_GATEWAY_LIMITED_BATCH_ENABLED }}
      HEALTHCHECK_URL: ${{ secrets.HEALTHCHECK_URL }}
      PUBLIC_SITE_URL: https://pegasmebel.ru
      NEXT_PUBLIC_GA_MEASUREMENT_ID: G-9J9TCX22S1
      NEXT_PUBLIC_YANDEX_METRIKA_ID: 108109755
      NEXT_PUBLIC_AIUP_PIXEL_ENABLED: "false"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20.18.1
          cache: npm
          cache-dependency-path: promotion/site/package-lock.json

      - name: Install dependencies
        working-directory: promotion/site
        run: npm ci

      - name: Run typecheck
        working-directory: promotion/site
        run: npm run typecheck

      - name: Run production build
        working-directory: promotion/site
        run: npm run build

      - name: Validate deploy secrets
        run: |
          set -euo pipefail
          for key in SSH_HOST SSH_USER SSH_PRIVATE_KEY APP_DIR APP_PORT SERVICE_NAME SUPABASE_URL SUPABASE_ANON_KEY SUPABASE_SERVICE_ROLE_KEY; do
            if [ -z "${!key:-}" ]; then
              echo "Missing required secret: $key" >&2
              exit 1
            fi
          done
          if [ -z "${BITRIX24_AIUP_CRM_WEBHOOK_URL:-}" ] && [ -z "${BITRIX24_TEST_CRM_WEBHOOK_URL:-}" ] && [ -z "${BITRIX24_WEBHOOK_URL:-}" ]; then
            echo "Missing required secret: BITRIX24_AIUP_CRM_WEBHOOK_URL, BITRIX24_TEST_CRM_WEBHOOK_URL or BITRIX24_WEBHOOK_URL" >&2
            exit 1
          fi

      - name: Prepare runtime env file
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/site.env" <<EOF
          NODE_ENV=production
          PORT=${APP_PORT}
          NEXT_PUBLIC_GA_MEASUREMENT_ID=${NEXT_PUBLIC_GA_MEASUREMENT_ID}
          NEXT_PUBLIC_YANDEX_METRIKA_ID=${NEXT_PUBLIC_YANDEX_METRIKA_ID}
          NEXT_PUBLIC_AIUP_PIXEL_ENABLED=${NEXT_PUBLIC_AIUP_PIXEL_ENABLED}
          NEXT_PUBLIC_SUPABASE_URL=${NEXT_PUBLIC_SUPABASE_URL}
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY=${NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY}
          SUPABASE_URL=${SUPABASE_URL}
          SUPABASE_ANON_KEY=${SUPABASE_ANON_KEY}
          SUPABASE_SERVICE_ROLE_KEY=${SUPABASE_SERVICE_ROLE_KEY}
          CRM_WEBHOOK_URL=${CRM_WEBHOOK_URL}
          BITRIX24_WEBHOOK_URL=${BITRIX24_WEBHOOK_URL}
          AIUP_GATEWAY_MANUAL_GATE=${AIUP_GATEWAY_MANUAL_GATE:-test-only-enabled}
          AIUP_GATEWAY_APPROVAL_TOKEN=${AIUP_GATEWAY_APPROVAL_TOKEN:-${BITRIX24_WEBHOOK_URL}}
          AIUP_GATEWAY_FIRST_REAL_CONTACT_APPROVAL_TOKEN=${AIUP_GATEWAY_FIRST_REAL_CONTACT_APPROVAL_TOKEN}
          BITRIX24_AIUP_CRM_WEBHOOK_URL=${BITRIX24_AIUP_CRM_WEBHOOK_URL}
          BITRIX24_TEST_CRM_WEBHOOK_URL=${BITRIX24_TEST_CRM_WEBHOOK_URL:-${BITRIX24_WEBHOOK_URL}}
          AIUP_GATEWAY_DAILY_LIMIT=${AIUP_GATEWAY_DAILY_LIMIT:-15}
          AIUP_GATEWAY_MODE=${AIUP_GATEWAY_MODE:-first_real_contact}
          AIUP_GATEWAY_NATIVE_WEBHOOK_ENABLED=${AIUP_GATEWAY_NATIVE_WEBHOOK_ENABLED:-enabled}
          AIUP_GATEWAY_LIMITED_BATCH_ENABLED=${AIUP_GATEWAY_LIMITED_BATCH_ENABLED:-}
          EOF

      - name: Prepare release archive
        run: |
          set -euo pipefail
          tar \
            --exclude='.git' \
            --exclude='node_modules' \
            --exclude='.next' \
            --exclude='.env' \
            --exclude='.env.*' \
            -czf "$RUNNER_TEMP/site-release.tgz" \
            -C promotion/site \
            .

      - name: Configure SSH
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.ssh"
          printf '%s\n' "$SSH_PRIVATE_KEY" > "$HOME/.ssh/id_ed25519"
          chmod 600 "$HOME/.ssh/id_ed25519"
          touch "$HOME/.ssh/known_hosts"
          ssh-keyscan -p "${SSH_PORT:-22}" "$SSH_HOST" >> "$HOME/.ssh/known_hosts" || true

      - name: Upload release package
        run: |
          set -euo pipefail
          ssh -o StrictHostKeyChecking=accept-new -p "${SSH_PORT:-22}" "${SSH_USER}@${SSH_HOST}" \
            "sudo -n rm -f /tmp/site-release.tgz /tmp/site.env /tmp/deploy-release.sh"
          scp -o StrictHostKeyChecking=accept-new -P "${SSH_PORT:-22}" "$RUNNER_TEMP/site-release.tgz" "${SSH_USER}@${SSH_HOST}:/tmp/site-release.tgz"
          scp -o StrictHostKeyChecking=accept-new -P "${SSH_PORT:-22}" "$RUNNER_TEMP/site.env" "${SSH_USER}@${SSH_HOST}:/tmp/site.env"
          scp -o StrictHostKeyChecking=accept-new -P "${SSH_PORT:-22}" "promotion/site/ops/deploy-release.sh" "${SSH_USER}@${SSH_HOST}:/tmp/deploy-release.sh"

      - name: Activate release on server
        run: |
          set -euo pipefail
          ssh -o StrictHostKeyChecking=accept-new -p "${SSH_PORT:-22}" "${SSH_USER}@${SSH_HOST}" \
            "set -euo pipefail
            deploy_owner=\$(stat -c '%U' '${APP_DIR}')
            deploy_group=\$(stat -c '%G' '${APP_DIR}')
            current_release=\$(readlink -f '${APP_DIR}/current' || true)
            if ! sudo -n systemctl is-active --quiet '${SERVICE_NAME}' || ! curl --fail --silent --max-time 5 'http://127.0.0.1:${APP_PORT}/' >/dev/null; then
              fallback_release=\$(find '${APP_DIR}/releases' -mindepth 1 -maxdepth 1 -type d -name 'manual-cta-restore-*' -printf '%T@ %p\n' | sort -nr | head -n 1 | cut -d' ' -f2-)
              if [ -n \"\${fallback_release}\" ]; then
                sudo -n ln -sfn \"\${fallback_release}\" '${APP_DIR}/current'
                sudo -n systemctl restart '${SERVICE_NAME}'
              fi
            fi
            sudo -n chown \"\${deploy_owner}:\${deploy_group}\" /tmp/site-release.tgz /tmp/site.env /tmp/deploy-release.sh
            sudo -n chmod 600 /tmp/site-release.tgz /tmp/site.env
            sudo -n chmod 700 /tmp/deploy-release.sh
            if ! sudo -n -u \"\${deploy_owner}\" env APP_DIR='${APP_DIR}' SERVICE_NAME='${SERVICE_NAME}' APP_PORT='${APP_PORT}' APP_DOMAIN='${APP_DOMAIN}' RELEASE_ARCHIVE='/tmp/site-release.tgz' ENV_FILE='/tmp/site.env' bash /tmp/deploy-release.sh; then
              sudo -n systemctl status '${SERVICE_NAME}' --no-pager -l || true
              sudo -n journalctl -u '${SERVICE_NAME}' -n 80 --no-pager || true
              exit 1
            fi"

      - name: Check public health endpoint
        run: |
          set -euo pipefail
          curl --fail --show-error --silent --retry 10 --retry-delay 5 "${PUBLIC_SITE_URL}/api/health"

      - name: Check CMS drift after deploy
        working-directory: promotion/site
        run: |
          set -euo pipefail
          npm run check:cms-drift -- "$PUBLIC_SITE_URL"

      - name: Check public mobile CTA freshness
        run: |
          set -euo pipefail
          html="$(curl --fail --show-error --silent --location \
            --retry 10 --retry-delay 5 \
            -H 'Cache-Control: no-cache' \
            -A 'Mozilla/5.0 (iPhone; CPU iPhone OS 17_0 like Mac OS X) AppleWebKit/605.1.15 Mobile/15E148 Safari/604.1' \
            "${PUBLIC_SITE_URL}/?deploy_mobile_cta_check=${GITHUB_SHA}")"
          printf '%s' "$html" | grep -F 'href="tel:+79166700043"' >/dev/null
          printf '%s' "$html" | grep -F 'Позвонить' >/dev/null
          printf '%s' "$html" | grep -F 'aria-label="Позвонить +7 916 670-00-43"' >/dev/null
